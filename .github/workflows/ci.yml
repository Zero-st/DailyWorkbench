name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch: {}

jobs:
  python:
    name: "Python: Lint & Test"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.10"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8

      - name: Check frontend cache version stamps
        # 前端资产改了却漏 bump 版本戳 → 用户端白屏。CI 硬性校验，不同步即失败。
        run: python bump_version.py --check

      - name: Lint (syntax/undefined-name only, non-blocking style)
        run: |
          flake8 . --select=E9,F63,F7,F82 --show-source
          flake8 . --exit-zero --max-line-length=120 --statistics

      - name: Run tests
        run: python -m pytest -q

  types:
    name: "Frontend: Type check (JSDoc + checkJs)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Type check (core module boundaries)
        # JSDoc + checkJs 仅覆盖 state.js / net.js（含 data.json 契约 WBData），零构建、
        # 不进浏览器产物。当前零报错，硬门禁：类型契约破坏即 CI 失败。范围见 jsconfig.json。
        run: npx -y -p typescript@latest tsc --noEmit -p jsconfig.json
