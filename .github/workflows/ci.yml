name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch: {}

jobs:
  python:
    name: "Python: Lint & Test"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.10"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8

      - name: All gates (cache stamps / design tokens / docs / flake8 / pytest)
        # 清单的唯一副本在 check_all.py——CI、.githooks/pre-commit、.claude/hooks/gate.py
        # 全部调它。这里刻意不逐项枚举：枚举一次就多一份会漂的副本，
        # docs/开发测试规范.md §3.1b 记过这个坑（gate.py 自带清单建起来当天就少了两项）。
        #
        # --strict：外部工具缺失视为失败，绝不静默转绿（宪章维度三禁假绿）。
        # --skip=tsc：本 job 没有 Node，类型契约归下面的 types job 跑；
        #             用显式排除而非静默跳过，否则 --strict 形同虚设。
        run: python check_all.py --check --strict --skip=tsc

      - name: Lint stats (non-blocking, informational)
        run: flake8 . --exit-zero --max-line-length=120 --statistics

  types:
    name: "Frontend: Type check (JSDoc + checkJs)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Type check (core module boundaries)
        # JSDoc + checkJs 仅覆盖 state.js / net.js（含 data.json 契约 WBData），零构建、
        # 不进浏览器产物。当前零报错，硬门禁：类型契约破坏即 CI 失败。范围见 jsconfig.json。
        run: npx -y -p typescript@latest tsc --noEmit -p jsconfig.json
