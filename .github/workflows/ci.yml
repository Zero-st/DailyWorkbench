name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch: {}

jobs:
  python:
    name: Python: Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.10"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8

      - name: Check frontend cache version stamps
        # 前端资产改了却漏 bump 版本戳 → 用户端白屏。CI 硬性校验，不同步即失败。
        run: python bump_version.py --check

      - name: Lint (syntax/undefined-name only, non-blocking style)
        run: |
          flake8 . --select=E9,F63,F7,F82 --show-source
          flake8 . --exit-zero --max-line-length=120 --statistics

      - name: Run tests
        run: python -m pytest -q
