<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  *{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
  body{width:320px;margin:0;padding:14px;background:#12161d;color:#e6edf3;font-size:13px}
  h1{margin:0 0 4px;font-size:15px;font-weight:700;color:#fff}
  .conn{font-size:11px;padding:2px 8px;border-radius:999px;background:#1c2230;border:1px solid #2a3140;color:#8b949e;display:inline-block;margin-bottom:12px}
  .conn.ok{color:#3fb950}.conn.warn{color:#d29922}
  label{display:block;font-size:11px;font-weight:600;color:#8b949e;margin:10px 0 4px}
  input,textarea{width:100%;background:#0d1117;color:#e6edf3;border:1px solid #2a3140;border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.6;resize:vertical}
  input:focus,textarea:focus{outline:none;border-color:#58a6ff;box-shadow:0 0 0 3px rgba(88,166,255,.15)}
  .row{display:flex;align-items:center;gap:8px;margin-top:12px}
  .msg{flex:1;font-size:11px;color:#8b949e}
  .msg.ok{color:#3fb950}.msg.warn{color:#d29922}
  button{padding:7px 14px;font-size:12px;font-weight:600;color:#fff;background:linear-gradient(180deg,#58a6ff,#2f7fe0);border:none;border-radius:8px;cursor:pointer}
  button.ghost{background:#1c2230;color:#e6edf3;border:1px solid #2a3140}
  button:disabled{opacity:.6;cursor:default}
  .sep{height:1px;background:#2a3140;margin:14px 0}
  .set{display:flex;align-items:center;gap:8px;font-size:12px;color:#8b949e}
  .set input[type=number]{width:76px}
  .set input[type=checkbox]{width:auto}
  a{color:#58a6ff;font-size:12px;text-decoration:none;cursor:pointer}
</style>
</head>
<body>
  <h1>存到工作台收件箱</h1>
  <span class="conn" id="conn">检测连接中…</span>

  <div id="pageInfo" style="font-size:11px;color:#8b949e;word-break:break-all;line-height:1.5"></div>

  <label>摘录（可选）</label>
  <textarea id="ex" rows="3" placeholder="当前页选中的文字会自动带过来"></textarea>
  <label>感悟 · 为什么值得存</label>
  <textarea id="note" rows="2" placeholder="一句话就够"></textarea>
  <label>标签（空格分隔，可选）</label>
  <input id="tags" placeholder="如 RAG Agent">

  <div class="row">
    <span class="msg" id="msg"></span>
    <button id="save">保存</button>
  </div>

  <div class="sep"></div>
  <div class="set">
    <span>后端端口</span><input type="number" id="port" min="1" max="65535">
    <label style="margin:0;display:flex;align-items:center;gap:5px;font-size:12px">
      <input type="checkbox" id="fab"> 选中浮按钮
    </label>
  </div>
  <div class="row"><a id="open">打开工作台收件箱 →</a></div>

  <script src="popup.js"></script>
</body>
</html>
